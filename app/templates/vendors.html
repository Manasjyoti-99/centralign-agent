{% extends 'base.html' %}

{% block title %}Vendors | Vendor Bills{% endblock %}

{% block content %}
    <h1>Vendors</h1>

    <div class="table-wrap">
        <table id="vendors-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Payment terms</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for vendor in vendors %}
                    <tr>
                        <td>{{ vendor['name'] }}</td>
                        <td>{{ vendor['email'] }}</td>
                        <td>{{ vendor['payment_terms'] }}</td>
                        <td>
                            <a id="edit-vendor-{{ vendor['id'] }}" href="{{ url_for('edit_vendor', vendor_id=vendor['id']) }}">Edit</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
